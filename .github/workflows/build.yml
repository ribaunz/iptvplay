name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# La versione è pinnata di proposito: questo progetto dipende da package con
# release cadence irregolare (media_kit su tutti), e una CI che segue "stable"
# rompe senza che nessuno abbia toccato il codice.
env:
  FLUTTER_VERSION: 3.47.2

jobs:
  # Cancello rapido: se analisi o test falliscono non ha senso occupare i
  # runner Windows e macOS, che costano di più.
  verify:
    name: Analisi e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # --split-per-abi: le librerie native di libmpv pesano ~5,5 MB per arm64
      # ma ~11 MB in un APK universale.
      - name: APK per ABI
        run: flutter build apk --release --split-per-abi

      # Play accetta solo AAB. Non è firmato qui: la firma richiede il keystore,
      # che non sta nel repository.
      - name: App bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  web:
    name: Web
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # --wasm compila sia WasmGC sia JavaScript e sceglie a runtime. Se una
      # dipendenza usasse dart:html o package:js questo passo fallirebbe: è il
      # controllo che tiene sotto osservazione la compatibilità WasmGC.
      - name: Build web
        run: flutter build web --release --wasm

      # sqlite3.wasm e drift_worker.js devono provenire dalla stessa release di
      # drift: un mismatch produce crash oscuri a runtime, non un errore di
      # build. Meglio accorgersene qui.
      - name: Verifica asset drift
        run: |
          test -f build/web/sqlite3.wasm || { echo "manca sqlite3.wasm"; exit 1; }
          test -f build/web/drift_worker.js || { echo "manca drift_worker.js"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          if-no-files-found: error

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  ios:
    name: iOS
    needs: verify
    runs-on: macos-latest
    # Verifica di compilazione senza firma: certificati e profili non stanno
    # nel repository. Per l'App Store serve Xcode 26+ (requisito dal 28 aprile
    # 2026) e la firma vera.
    #
    # Questo job può fallire: media_kit_libs_ios_video è fermo a settembre 2023
    # e la issue media-kit#1418 segnala la build iOS rotta da Flutter 3.44.
    # È esattamente il motivo per cui vale la pena tenerlo in CI — è l'unico
    # modo per accorgersene senza un Mac.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Runner.entitlements non e' collegato al target (il perche' sta dentro al
      # file), quindi nulla lo compila e un plist malformato si scoprirebbe solo
      # il giorno in cui serve davvero. plutil costa un secondo.
      - name: Verifica i plist di iOS
        run: plutil -lint ios/Runner/Info.plist ios/Runner/Runner.entitlements

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

      # IPA non firmato.
      #
      # Un .ipa e' solo uno zip con l'app dentro una cartella Payload/. Farlo
      # qui e' quello che rende il job utile a chi non ha un Mac: Sideloadly o
      # AltStore, su Windows, lo rifirmano con un Apple ID qualunque e lo
      # installano sull'iPhone via USB. Con un account gratuito dura 7 giorni.
      #
      # `xcodebuild -exportArchive` non e' un'alternativa: pretende certificati
      # e profili, che e' esattamente cio' che qui non c'e'.
      # Il percorso non e' fissato a memoria: se Flutter cambia layout, il job
      # lo dice elencando cosa ha trovato, invece di caricare un archivio vuoto.
      - name: Impacchetta un IPA non firmato
        run: |
          set -euo pipefail
          APP=$(find build/ios -maxdepth 3 -type d -name '*.app' -path '*iphoneos*' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::nessun .app per dispositivo trovato sotto build/ios"
            find build/ios -maxdepth 3 -type d -name '*.app' || true
            exit 1
          fi
          echo "trovato: $APP"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP" /tmp/Payload/
          (cd /tmp && zip -qry iptvplay-unsigned.ipa Payload)
          mv /tmp/iptvplay-unsigned.ipa .
          du -h iptvplay-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: iptvplay-unsigned.ipa
          if-no-files-found: error

      # Build per il Simulatore, per chi un Mac ce l'ha.
      #
      # Architettura e SDK sono diversi da quelli del dispositivo, quindi non e'
      # una ripetizione: e' l'unica configurazione che intercetta le rotture
      # specifiche del simulatore prima che lo faccia una persona.
      #
      # Attenzione a cosa NON si puo' provare li': niente riproduzione video
      # affidabile (libmpv in simulatore e' inaffidabile) e niente multicast,
      # quindi ne' player ne' trasmissione al televisore.
      # `--simulator` implica gia' il debug mode (il release non e' supportato
      # in simulatore), ma lo si scrive per non doverlo ricordare.
      - name: Build per Simulatore
        run: flutter build ios --simulator --debug

      # Lo zip si fa a mano di proposito: upload-artifact, puntato a una
      # cartella .app, ne carica il *contenuto* e perde l'involucro — che e'
      # esattamente cio' che `xcrun simctl install` pretende.
      - name: Impacchetta il bundle per simulatore
        run: |
          set -euo pipefail
          APP=$(find build/ios -maxdepth 3 -type d -name '*.app' -path '*imulator*' -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::nessun .app per simulatore trovato sotto build/ios"
            find build/ios -maxdepth 3 -type d -name '*.app' || true
            exit 1
          fi
          echo "trovato: $APP"
          ditto -ck --keepParent "$APP" iptvplay-simulator.zip
          du -h iptvplay-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: iptvplay-simulator.zip
          if-no-files-found: error
